<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://api.binance.com https://data-api.binance.vision wss://stream.binance.com:9443 wss://data-stream.binance.vision;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floating Crypto</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section class="ticker-window" aria-label="Crypto price from Binance">
      <header class="titlebar">
        <div class="asset">
          <span class="coin-mark" id="coinMark" aria-hidden="true">BTC</span>
          <span class="asset-copy">
            <strong id="assetName">BTC</strong>
            <span id="pairLabel">BTC / USDT &middot; Binance</span>
          </span>
        </div>

        <div class="titlebar-actions">
          <span class="feed-state" id="feedState" data-state="connecting">
            <span class="status-dot"></span>
            <span id="feedLabel">Connecting</span>
          </span>
          <button
            class="icon-button favorite-button"
            id="favoriteButton"
            type="button"
            title="Add BTC to quick picks"
            aria-label="Add BTC to quick picks"
            aria-pressed="false"
          >
            <i data-lucide="heart" aria-hidden="true"></i>
          </button>
          <button
            class="icon-button window-lock-button control-button"
            id="windowLockButton"
            type="button"
            title="Lock position and size"
            aria-label="Lock position and size"
            aria-pressed="false"
          >
            <span class="window-lock-icon window-lock-closed">
              <i data-lucide="lock" aria-hidden="true"></i>
            </span>
            <span class="window-lock-icon window-lock-open">
              <i data-lucide="lock-open" aria-hidden="true"></i>
            </span>
          </button>
          <button
            class="icon-button control-button"
            id="miniModeButton"
            type="button"
            title="Mini mode"
            aria-label="Mini mode"
          >
            <i data-lucide="minimize-2" aria-hidden="true"></i>
          </button>
          <button
            class="icon-button control-button"
            id="pinButton"
            type="button"
            title="Always on top"
            aria-label="Always on top"
            aria-pressed="true"
          >
            <i data-lucide="pin" aria-hidden="true"></i>
          </button>
          <button
            class="icon-button close-button control-button"
            id="closeButton"
            type="button"
            title="Close"
            aria-label="Close"
          >
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <main class="market-panel">
        <div class="price-row">
          <p class="price" id="price">$--</p>
          <span class="change" id="change">--</span>
        </div>

        <div class="market-meta">
          <span id="marketLabel">24H CHANGE</span>
          <span class="meta-separator" aria-hidden="true"></span>
          <span id="updated">Connecting to Binance</span>
        </div>

        <div class="chart-frame">
          <div class="chart-grid" aria-hidden="true"></div>
          <svg
            class="chart"
            id="chart"
            viewBox="0 0 320 62"
            preserveAspectRatio="none"
            role="img"
            aria-label="Crypto price movement over the last hour"
          >
            <defs>
              <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
                <stop class="chart-fill-start" offset="0%" />
                <stop class="chart-fill-end" offset="100%" />
              </linearGradient>
            </defs>
            <path class="chart-area" id="chartArea" d="" />
            <path class="chart-line" id="chartLine" d="" />
          </svg>
          <span class="chart-period">1H</span>
        </div>
      </main>

      <footer class="market-stats">
        <div class="stat">
          <span>24H HIGH</span>
          <strong id="high">$--</strong>
        </div>
        <div class="stat">
          <span>24H LOW</span>
          <strong id="low">$--</strong>
        </div>
        <div class="stat">
          <span>24H VOLUME</span>
          <strong id="volume">--</strong>
        </div>
      </footer>

      <div class="offline-banner" id="offlineBanner" role="status" hidden>
        Binance connection lost. Retrying&hellip;
      </div>

      <div class="mini-bar" aria-label="Mini crypto ticker">
        <div class="mini-asset" id="miniAsset">
          <span class="coin-mark mini-coin-mark" id="miniCoinMark" aria-hidden="true">
            BTC
          </span>
          <p class="mini-price" id="miniPrice">$--</p>
        </div>
        <div class="mini-actions">
          <span class="feed-state mini-feed-state" id="miniFeedState" data-state="connecting">
            <span class="status-dot"></span>
            <span id="miniFeedLabel">Connecting</span>
          </span>
          <button
            class="icon-button window-lock-button control-button"
            id="miniWindowLockButton"
            type="button"
            title="Lock position and size"
            aria-label="Lock position and size"
            aria-pressed="false"
          >
            <span class="window-lock-icon window-lock-closed">
              <i data-lucide="lock" aria-hidden="true"></i>
            </span>
            <span class="window-lock-icon window-lock-open">
              <i data-lucide="lock-open" aria-hidden="true"></i>
            </span>
          </button>
          <button
            class="icon-button control-button"
            id="miniMaximizeButton"
            type="button"
            title="Full mode"
            aria-label="Full mode"
          >
            <i data-lucide="maximize-2" aria-hidden="true"></i>
          </button>
          <button
            class="icon-button control-button"
            id="miniPinButton"
            type="button"
            title="Always on top"
            aria-label="Always on top"
            aria-pressed="true"
          >
            <i data-lucide="pin" aria-hidden="true"></i>
          </button>
          <button
            class="icon-button close-button control-button"
            id="miniCloseButton"
            type="button"
            title="Close"
            aria-label="Close"
          >
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="resize-handles" aria-hidden="true">
        <span class="resize-handle resize-n" data-resize-direction="n"></span>
        <span class="resize-handle resize-s" data-resize-direction="s"></span>
        <span class="resize-handle resize-e" data-resize-direction="e"></span>
        <span class="resize-handle resize-w" data-resize-direction="w"></span>
        <span class="resize-handle resize-ne" data-resize-direction="ne"></span>
        <span class="resize-handle resize-nw" data-resize-direction="nw"></span>
        <span class="resize-handle resize-se" data-resize-direction="se"></span>
        <span class="resize-handle resize-sw" data-resize-direction="sw"></span>
      </div>
    </section>

    <div class="coin-dialog" id="coinDialog" hidden>
      <button
        class="coin-dialog-backdrop"
        id="coinDialogBackdrop"
        type="button"
        aria-label="Close coin picker"
      ></button>
      <section
        class="coin-dialog-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="coinDialogTitle"
      >
        <header class="coin-dialog-header">
          <div>
            <span>Choose market</span>
            <strong id="coinDialogTitle">Coins</strong>
          </div>
          <button
            class="icon-button"
            id="coinDialogClose"
            type="button"
            title="Close"
            aria-label="Close coin picker"
          >
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </header>
        <label class="coin-search">
          <i data-lucide="search" aria-hidden="true"></i>
          <input
            id="coinSearchInput"
            type="search"
            placeholder="Search coin or pair"
            autocomplete="off"
            spellcheck="false"
            aria-label="Search coins"
          />
        </label>
        <div class="quick-coins" id="quickCoinList"></div>
        <div class="coin-list-status" id="coinListStatus">Loading markets...</div>
        <div class="coin-list" id="coinList" role="listbox" aria-label="Coins"></div>
      </section>
    </div>

    <div class="color-dialog" id="colorDialog" hidden>
      <button
        class="color-dialog-backdrop"
        id="colorDialogBackdrop"
        type="button"
        aria-label="Close color picker"
      ></button>
      <section
        class="color-dialog-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="colorDialogTitle"
      >
        <header class="color-dialog-header">
          <div>
            <span>Custom color</span>
            <strong id="colorDialogTitle">Background</strong>
          </div>
          <button
            class="icon-button"
            id="colorDialogClose"
            type="button"
            title="Close"
            aria-label="Close color picker"
          >
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </header>
        <div class="color-dialog-content">
          <div class="color-preview-column">
            <div class="color-preview" id="colorPreview"></div>
            <label class="color-hex-field">
              <span>HEX</span>
              <input
                id="colorHexInput"
                type="text"
                value="#131316"
                maxlength="7"
                spellcheck="false"
                autocomplete="off"
                aria-label="HEX color code"
              />
            </label>
          </div>
          <div class="color-sliders">
            <label class="color-slider-row">
              <span>Hue</span>
              <input id="hueSlider" type="range" min="0" max="360" value="0" />
              <output id="hueValue">0&deg;</output>
            </label>
            <label class="color-slider-row">
              <span>Sat</span>
              <input
                id="saturationSlider"
                type="range"
                min="0"
                max="100"
                value="0"
              />
              <output id="saturationValue">0%</output>
            </label>
            <label class="color-slider-row">
              <span>Light</span>
              <input
                id="lightnessSlider"
                type="range"
                min="0"
                max="100"
                value="0"
              />
              <output id="lightnessValue">0%</output>
            </label>
          </div>
        </div>
      </section>
    </div>

    <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
    <script src="./lib/market.js"></script>
    <script src="./lib/coins.js"></script>
    <script src="./lib/color.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
